# Vhost di riferimento per mycarbook.chainintegrate.it.
# Da confrontare/fondere con quello in produzione (/etc/nginx/sites-available/),
# mantenendo i percorsi dei certificati esistenti. Verifica: `sudo nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name mycarbook.chainintegrate.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mycarbook.chainintegrate.it;

    # ssl_certificate     /etc/letsencrypt/live/mycarbook.chainintegrate.it/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mycarbook.chainintegrate.it/privkey.pem;

    server_tokens off;
    root /var/www/mycarbook/frontend;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/mycarbook-security-headers.conf;

    # Mai servire file nascosti o di servizio.
    location ~ /\.            { return 404; }
    location = /js/package.json { return 404; }

    # Backend (solo loopback). X-Forwarded-For con l'IP reale del client:
    # il backend lo usa per il rate limit per IP (trust proxy "loopback",
    # audit MCB-02). $remote_addr sovrascrive eventuali valori inviati dal client.
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
        proxy_read_timeout 90s;
        include /etc/nginx/snippets/mycarbook-security-headers.conf;
    }

    # Librerie e font con nome versionato: cache lunga.
    location ~ ^/(vendor|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/mycarbook-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
