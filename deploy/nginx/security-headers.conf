# Intestazioni di sicurezza di mycarbook.chainintegrate.it (audit MCB-01,
# MCB-16). Da includere nel blocco `server { ... }` HTTPS E in ogni
# `location` che ha propri `add_header` (Nginx non eredita gli add_header
# del livello superiore in una location che ne definisce altri).
#
# Content-Security-Policy:
# - script-src 'self': si esegue solo codice servito dal sito; niente
#   script inline, niente gestori onerror=/onclick= iniettati, niente CDN;
# - style-src 'self': niente stili inline (tutti spostati in css/);
# - img-src / connect-src: il sito e i due gateway IPFS (nodo proprio e
#   gateway LUKSO di riserva per i file non ancora ripinnati, MCB-17);
# - nessun plugin, form, <base>; pagina non incorporabile in altri siti.
# La connessione alla catena passa dall'estensione Universal Profile
# (window.lukso), non da fetch della pagina: nessun RPC in connect-src.
#
# Per provare una modifica senza bloccare nulla: rinominare l'intestazione
# in "Content-Security-Policy-Report-Only" (il browser segnala in console).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://ipfs.chainintegrate.it https://api.universalprofile.cloud; font-src 'self'; connect-src 'self' https://ipfs.chainintegrate.it https://api.universalprofile.cloud; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
