# Intestazioni del gateway ipfs.chainintegrate.it (audit MCB-10, GEN-03).
# Applicate il 16/11/2026 nel blocco `server { ... }` HTTPS di
# /etc/nginx/sites-available/ipfs-gateway sul server del nodo IPFS
# (la `location /` non ha propri add_header e le eredita).
#
# Il gateway è sullo stesso sito (chainintegrate.it) di tutte le app: un file
# HTML/SVG pinnato verrebbe eseguito come pagina del nostro dominio. Con
# queste intestazioni il browser non indovina il tipo (nosniff) e non esegue
# script in nessun file servito dal gateway.
#
# - object-src 'self': il visualizzatore PDF del browser può aprire i PDF in
#   chiaro serviti dal gateway (es. "Vedi documento" in MyCarBook); gli
#   script restano bloccati.
# - Niente frame-ancestors: in Report-Only non era verificabile se qualche
#   app mostra file del gateway in un iframe, e su file grezzi non serve.
# - Gli allegati cifrati (application/octet-stream) vengono scaricati e
#   decifrati dalle app: non dipendono da questa policy.
#
# Il gateway è condiviso con le altre app ChainIntegrate (Supplier,
# Traceability, account, ...): ogni modifica va provata prima in
# "Content-Security-Policy-Report-Only".
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'self'" always;
add_header Referrer-Policy "no-referrer" always;
