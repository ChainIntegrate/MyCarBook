# Intestazioni consigliate per il gateway ipfs.chainintegrate.it (audit
# MCB-10, GEN-03). Il gateway è sullo stesso sito (chainintegrate.it) di
# tutte le app: un file HTML/SVG pinnato verrebbe eseguito come pagina del
# nostro dominio. Con queste intestazioni il browser non indovina il tipo
# (nosniff) e non esegue script in nessun file servito dal gateway.
#
# ATTENZIONE: il gateway è condiviso con le altre app ChainIntegrate
# (Supplier, Traceability, ...). Introdurre prima in Report-Only e
# verificare che immagini e PDF si aprano ancora in tutte le app.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
add_header Referrer-Policy "no-referrer" always;
